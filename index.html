<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { display: grid; place-items: center; }
  #wrap {
    position: relative;
    width: min(100vw, 100vh);
    width: min(100vw, 100dvh);
    aspect-ratio: 1 / 1;
    background: #fff;
    outline: 1px solid #e5e5e5;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  button {
    position: absolute; right: 12px; bottom: 12px;
    font: 14px/1 system-ui, sans-serif;
    padding: 10px 14px; border: 1px solid #111; border-radius: 999px;
    background: #fff; color: #111; cursor: pointer;
  }
  button:active { background: #111; color: #fff; }
</style>
</head>
<body>
<div id="wrap" style="background: #fff url('atilla.png') center / cover no-repeat;">
  <canvas id="c"></canvas>
  <button id="save" style="right:100px;">Save</button>
  <button id="bg" style="right:180px;">Background</button>
  <input id="bgfile" type="file" accept="image/*" hidden>
  <button id="clear">Erase</button>
</div>
<script>
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let strokes = [];   // points stored as 0-1 so drawings survive resizing
  let current = null;
  let bgSrc = 'atilla.png';  // replaced by a blob: URL when the user picks an image

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = wrap.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    render();
  }

  function render() {
    const s = canvas.width;
    ctx.clearRect(0, 0, s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Math.max(2, s * 0.006);
    for (const stroke of strokes) {
      ctx.beginPath();
      stroke.forEach((p, i) => {
        const x = p.x * s, y = p.y * s;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (stroke.length === 1) ctx.lineTo(stroke[0].x * s + 0.1, stroke[0].y * s);
      ctx.stroke();
    }
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    current = [pos(e)];
    strokes.push(current);
    render();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    current.push(pos(e));
    render();
  });
  const end = () => { current = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  document.getElementById('clear').addEventListener('click', () => { strokes = []; render(); });
  const bgfile = document.getElementById('bgfile');
  document.getElementById('bg').addEventListener('click', () => bgfile.click());
  bgfile.addEventListener('change', () => {
    const file = bgfile.files[0];
    if (!file) return;
    if (bgSrc.startsWith('blob:')) URL.revokeObjectURL(bgSrc);
    // blob: URLs are same-origin, so the export canvas is never tainted, even from file://
    bgSrc = URL.createObjectURL(file);
    wrap.style.backgroundImage = `url("${bgSrc}")`;
    bgfile.value = '';
  });

  window.addEventListener('resize', resize);
  resize();
  document.getElementById('save').addEventListener('click', () => {
  // a canvas stays tainted forever once a file:// image is drawn, so each attempt gets a fresh one
  function blank() {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const x = c.getContext('2d');
    x.fillStyle = '#fff';
    x.fillRect(0, 0, c.width, c.height);
    return c;
  }

  function download(c) {
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = 'atilla.png';
    a.click();
  }

  function drawingOnly() {
    const c = blank();
    c.getContext('2d').drawImage(canvas, 0, 0);
    return c;
  }

  function finish() {
    try {
      download(out);
    } catch (e) {
      // file:// pages taint the canvas when drawing atilla.png; serve over http to keep the background
      if (e.name !== 'SecurityError') return alert('Could not save: ' + e.message);
      alert('Background cannot be exported when opened as a local file; saving the drawing only. Pick it with "Background" or serve over http to include it.');
      download(drawingOnly());
    }
  }

  const out = blank(), o = out.getContext('2d');
  const img = new Image();
  img.onload = () => {
    const s = Math.max(out.width / img.width, out.height / img.height);
    const w = img.width * s, h = img.height * s;
    o.drawImage(img, (out.width - w) / 2, (out.height - h) / 2, w, h);
    o.drawImage(canvas, 0, 0);
    finish();
  };
  img.onerror = () => {
    alert('Background image not found, saving the drawing only.');
    download(drawingOnly());
  };
  img.src = bgSrc;
});
</script>
</body>
</html>
